[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-stays"
version = "1.0.0"
description = "Black Diamond Hub app: switches the homepage to guest mode during stays from the Stays AppDaemon app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.3,<1",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-stays"

[project.entry-points."blackdiamondhub.plugins"]
stays = "stays.plugin:spec"

[tool.setuptools.packages.find]
include = ["stays", "stays.*"]
